<!DOCTYPE html>
<html>
 <head>
   <meta charset="UTF-8" />
   <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
   <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
   />
   <meta
    http-equiv="X-Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
   />
   <title>photobooth by brielle</title>
   <style>
    body{
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #fff;
    }
    #video{
      width: 535px;
      height: 400px;
      background: #000;
      border: 3px solid #000;
      border-radius: 10px;
      align-items: center;
      transform: scaleX(-1); /* flip the webcam feed horizontally */
    }
    button{
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #video-container{
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #countdown{
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      font-weight: bold;
      color: white;
      pointer-events: none;
    }
    #flash {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: white;
    opacity: 0; /* hidden by default */
    pointer-events: none;
    transition: opacity 0.2s ease-in-out;
}
   </style>
 </head>
 <body>
   <h1> brielle's photobooth </h1>
   <div id="video-container">
      <video id = "video" autoplay></video>
      <div id = "countdown"></div>  
      <div id="flash"></div> <!--flash overlay-->
   </div>
   <br>
   <button id = "startCamera">Start Camera</button>
   <button id = "takePhoto">Take Photo</button>
   <div id = "countdown"></div>
   <canvas id = "canvas" style = "display:none;"></canvas>
   <div id="photos"></div>
 </body>
 <script src ="./renderer.js"></script>
</html>
