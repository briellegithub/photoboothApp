<!DOCTYPE html>
<html>
 <head>
   <meta charset="UTF-8" />
   <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dongle&family=La+Belle+Aurore&display=swap" rel="stylesheet"> 
   <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com"
    />

   <title>brielle's photobooth</title>
   <style>
    body{
      font-family: Arial, sans-serif;
      color: #A66D45;
      text-align: center;
      padding: 10px;
      background: #EFE8D8;
    }
    .la-belle-aurore-regular {
      font-family: "La Belle Aurore", cursive;
      font-weight: 400;
      font-size: 40px;
      font-style: normal;
      margin-bottom: 10px;
      margin-top: 10px;
    }
    .dongle-regular {
      font-family: "Dongle", sans-serif;
      font-weight: 400;
      font-style: normal;
    }
    #video{
      width: 401px;
      height: 300px;
      background: #A66D45;
      border: 3px solid #A66D45;
      border-radius: 10px;
      align-items: center;
      transform: scaleX(-1); /* flip the webcam feed horizontally */
    }
    button{
      font-family: "Dongle", sans-serif;
      font-weight: 200;
      font-style: normal;
      color: #EFE8D8;
      margin: 10px;
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
      border-radius: 25px;
      border: 1px;
      background:#A66D45; 
    }
    #video-container{
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #countdown{
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      font-weight: bold;
      color: #e4d9c0;
      pointer-events: none;
    }
    #flash {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: white;
    opacity: 0; /* hidden by default */
    pointer-events: none;
    transition: opacity 0.2s ease-in-out;
}
   </style>
 </head>
 <body>
   <h1 class = "la-belle-aurore-regular"> photobooth </h1>
   <div id="video-container">
      <video id = "video" autoplay></video>
      <div id = "countdown" class = "dongle-regular"></div>  
      <div id="flash"></div> <!--flash overlay-->
   </div>
   <br>
   <button id = "takePhoto">Take Photo</button>
   <div>
    <button id = "filterNone">No Filter</button>
    <button id = "filterGrayscale">Grayscale</button>
    <button id = "filterSepia">Sepia</button>
   </div>
   <canvas id = "canvas" style = "display:none;"></canvas>
   <div id="photos"></div>
 </body>
 <script src ="./renderer.js"></script>
</html>
